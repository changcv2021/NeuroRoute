[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuroroute"
version = "0.1.0"
description = "FlyCNS: connectome-grounded control with constrained communication"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

